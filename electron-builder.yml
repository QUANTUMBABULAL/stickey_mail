appId: com.mailsticker.app
productName: Mail Sticker
copyright: Copyright © 2026 Mail Sticker

directories:
  buildResources: build
  output: release/${version}

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!release/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.editorconfig,.gitignore,.npmrc}'
  - '!{README.md,LICENSE}'
  - '!**/*.map'

extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'

asar: true
npmRebuild: false
buildDependenciesFromSource: false

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mail Sticker
  uninstallDisplayName: Mail Sticker ${version}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: ${productName}-${version}-Portable.${ext}

publish: null
